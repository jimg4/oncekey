[package]
name = "butterfly-guard"
version = "1.2.0"
edition = "2021"

[dependencies]
evdev = "0.13.2"
libc = "0.2"
nix = { version = "0.29", features = ["ioctl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
